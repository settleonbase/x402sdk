services:
  db:
    image: postgres:15
    container_name: beamio-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: beamio
    volumes:
      # Existing library from the previous Docker data root. Set PG_DATA_ROOT in the private
      # environment file (no default). Do not use a fresh named volume.
      - ${PG_DATA_ROOT:?set PG_DATA_ROOT in the private environment file}/volumes/db_pgdata/_data:/var/lib/postgresql/data
      - /dev/hugepages:/dev/hugepages:rw
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: "256mb"
    command:
      - postgres
      - -c
      - huge_pages=try
      - -c
      - shared_buffers=512MB
