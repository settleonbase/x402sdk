# nginx in front of wallet-signer (recommended mode).
#
# nginx terminates TLS with the public (Let's Encrypt) certificate, requires a client certificate
# signed by our private client CA, and forwards POST /rpc to wallet-signer's local socket with the
# client's CN in X-WS-Client-CN. wallet-signer trusts those headers only on that socket and refuses
# them on every other listener. The admin socket (wsctl) is never reachable through nginx.
#
# Install as /etc/nginx/conf.d/wallet-signer.conf (http context). Replace:
#   signer.example.invalid   -> the signer's DNS name (also in the certificate paths)
#   /etc/nginx/wallet-signer/allow.conf -> create it: one `allow <ip>;` per daemon host, then `deny all;`
# Remove any other server block for the same name on 443 (certbot may have added one).
# Tested with nginx 1.31 (local integration test); uses nothing newer than 1.28.

# CN of a verified client certificate. nginx has no CN-only variable, so take it from the RFC 2253
# subject (CN comes first). Only plain names match; anything else gives "" and is refused.
map $ssl_client_s_dn $ws_client_cn {
    default "";
    "~^CN=(?<ws_cn>[A-Za-z0-9._-]{1,64})(,|$)" $ws_cn;
}

log_format wallet_signer '$time_iso8601 $remote_addr cn=$ws_client_cn verify=$ssl_client_verify '
                         '"$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

# Per client certificate, on top of wallet-signer's own per-array limits.
limit_req_zone $ws_client_cn zone=wallet_signer_rpc:1m rate=20r/s;

upstream wallet_signer {
    # wallet-signer config: rpc.proxied.path. Directory is walletsigner:www-data 2750.
    server unix:/run/wallet-signer-rpc/rpc.sock;
    # TCP fallback (then also set X-WS-Proxy-Auth below and rpc.proxied.secretSha256):
    # server 127.0.0.1:8445;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signer.example.invalid;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/signer.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signer.example.invalid/privkey.pem;
    # Takes effect only if this is the default server on 443 (protocol is chosen before SNI).
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    # mTLS: no certificate, or one not signed by this CA -> 400 before any request reaches upstream.
    ssl_client_certificate /etc/wallet-signer/tls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    # Optional revocation list from the client CA:
    # ssl_crl /etc/wallet-signer/tls/client-ca.crl;

    include /etc/nginx/wallet-signer/allow.conf;

    access_log /var/log/nginx/wallet-signer.access.log wallet_signer;
    error_log  /var/log/nginx/wallet-signer.error.log warn;

    client_max_body_size 256k;
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 65s;
    # Defaults, stated so nobody relaxes them: headers with "_" are dropped, not passed upstream.
    ignore_invalid_headers on;
    underscores_in_headers off;

    location = /rpc {
        limit_except POST { deny all; }
        limit_req zone=wallet_signer_rpc burst=40 nodelay;

        proxy_pass http://wallet_signer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host wallet-signer;

        # Identity. proxy_set_header replaces any client-sent header of the same name, so a client
        # cannot inject these; wallet-signer also refuses duplicates and unknown X-WS-* headers.
        proxy_set_header X-WS-Client-CN          $ws_client_cn;
        proxy_set_header X-WS-Client-Verify      $ssl_client_verify;
        proxy_set_header X-WS-Client-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-WS-Client-Serial      $ssl_client_serial;
        proxy_set_header X-WS-Remote-Addr        $remote_addr;
        # TCP fallback only (value from a root-only include, never in this file):
        # include /etc/nginx/wallet-signer/proxy-auth.conf;   # proxy_set_header X-WS-Proxy-Auth "...";

        # Nothing else that looks like forwarding metadata goes upstream.
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP         "";
        proxy_set_header Forwarded         "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        # signer_sendTransaction may wait for an idle key (keyWaitMs 30 s) and for broadcast.
        proxy_read_timeout 90s;
        # Never resend a request to the signer: it could sign twice.
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}

# Port 80 stays as it is (301 to https). If certificates renew with HTTP-01, port 80 must stay
# reachable from the internet; only 443 is limited to the daemon hosts.
