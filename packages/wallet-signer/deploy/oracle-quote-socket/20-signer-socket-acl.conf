[Service]
# Grant exactly one user (oracle-daemon) rw on the signer oracle socket, right before each run.
# "+" runs this step outside the unit sandbox. It touches only this socket, never the signer, its unit or directories.
ExecStartPre=+/bin/sh -c 's=/run/wallet-signer-oracle/oracle-daemon.sock; test -S "$$s" && test ! -L "$$s" && exec /usr/bin/setfacl -m u:oracle-daemon:rw "$$s"'
