# Lab payout socket directory for the PM-service listener (walletsigner, group wslab, setgid 2750).
# The setgid bit makes the socket inherit group wslab, so no chown is needed and walletsigner keeps its own
# primary group (wsadmin). Adding walletsigner to wslab is a separate system change and must be approved.
# DO NOT apply this file on a host without owner approval. Check first whether the directory already exists.
d /run/wallet-signer-lab-mining-pool 2750 walletsigner wslab -
